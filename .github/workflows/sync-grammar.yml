name: Sync grammar

on:
  push:
    branches: [main]
    paths: [syntax/prism.js]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Open a PR on the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ripe-lang/www.ripe-lang.org
          token: ${{ secrets.SITE_TOKEN }}
          path: site

      - name: Copy the grammar
        run: cp syntax/prism.js site/src/theme/prism-include-languages.js

      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SITE_TOKEN }}
          path: site
          add-paths: src/theme/prism-include-languages.js
          branch: sync-grammar
          delete-branch: true
          commit-message: Sync the grammar
          title: Sync the grammar
          body: ""
